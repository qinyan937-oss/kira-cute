
<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KIRA | 闪闪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+JP:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
      :root { --cursor-color: #ec4899; }
      body {
        font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
        background-color: #ffe4e1;
        background-image: 
          linear-gradient(45deg, #fff0f5 25%, transparent 25%, transparent 75%, #fff0f5 75%, #fff0f5),
          linear-gradient(45deg, #fff0f5 25%, transparent 25%, transparent 75%, #fff0f5 75%, #fff0f5);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* 让 React 组件层保持透明，确保背景粒子可见 */
      #root, 
      #root > div, 
      #root > div > header,
      main {
        background-color: transparent !important;
      }

      /* 星星容器 */
      #sparkle-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 1; 
        overflow: hidden;
      }

      #root {
        position: relative;
        z-index: 10;
      }

      .sparkle {
        position: absolute;
        opacity: 0;
        will-change: transform, opacity;
        /* 混合三个动画：闪烁、漂浮、自转 */
        animation: 
          twinkle var(--duration) ease-in-out infinite, 
          float var(--float-duration) ease-in-out infinite,
          rotate var(--rotate-duration) linear infinite;
      }

      /* 日系十字闪星 */
      .star-4 {
        clip-path: polygon(50% 0%, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0% 50%, 45% 45%);
      }

      /* 经典五角星 */
      .star-5 {
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }

      /* 圆形光点 */
      .circle {
        border-radius: 50%;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.2); }
        20%, 80% { opacity: 0; }
        50% { opacity: var(--max-opacity); transform: scale(1.3); }
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(var(--move-x), var(--move-y)); }
        50% { transform: translate(calc(var(--move-x) * -0.5), calc(var(--move-y) * 1.5)); }
        75% { transform: translate(calc(var(--move-x) * 1.2), calc(var(--move-y) * -0.8)); }
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(var(--rotation-end)); }
      }

      .text-3d {
        color: #ec4899;
        text-shadow: 
          -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,
          2px 2px 0 #f9a8d4, 4px 4px 0 #f472b6;
      }

      .text-jelly {
        color: #3b82f6;
        text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0px 3px 0 #fff, 0px 6px 10px rgba(59, 130, 246, 0.3);
        font-weight: 900;
      }

      input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
      input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 10px; background: #fce7f3; border-radius: 999px; border: 2px solid #fff; }
      input[type=range]::-webkit-slider-thumb { height: 24px; width: 24px; border-radius: 50%; background: #ec4899; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3); -webkit-appearance: none; margin-top: -8px; cursor: pointer; }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      @keyframes float-btn { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
      .animate-float { animation: float-btn 3s ease-in-out infinite; }
      .animate-fade-in { animation: fadeIn 0.2s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .animate-spin-slow { animation: spinSlow 8s linear infinite; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
  </head>
  <body>
    <!-- Background Sparkles Container -->
    <div id="sparkle-container"></div>
    
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>

    <script>
      const container = document.getElementById('sparkle-container');
      const colors = [
        '#ffffff', // 晶莹白
        '#ffb7ce', // 樱花粉
        '#bae6fd', // 天空蓝
        '#fef08a', // 浅金色
        '#f472b6', // 桃粉色
        '#60a5fa'  // 亮蓝色
      ];
      const count = 120; // 增加密度

      function createSparkle() {
        const sparkle = document.createElement('div');
        const rand = Math.random();
        
        // 随机形状
        let shapeClass = 'circle';
        if (rand > 0.6) shapeClass = 'star-4';
        else if (rand > 0.4) shapeClass = 'star-5';
        
        sparkle.className = `sparkle ${shapeClass}`;
        
        const size = (shapeClass.includes('star')) ? (Math.random() * 15 + 8) : (Math.random() * 6 + 4);
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const duration = Math.random() * 2 + 1.5; // 更快的闪烁
        const floatDuration = Math.random() * 15 + 15;
        const rotateDuration = Math.random() * 5 + 5;
        const delay = Math.random() * -10; 
        const maxOpacity = Math.random() * 0.8 + 0.4; // 提高亮度
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        // 随机位移轨迹
        const moveX = (Math.random() - 0.5) * 150;
        const moveY = (Math.random() - 0.5) * 150;
        const rotationEnd = (Math.random() > 0.5 ? 360 : -360) + 'deg';

        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        sparkle.style.left = `${x}%`;
        sparkle.style.top = `${y}%`;
        sparkle.style.backgroundColor = color;
        
        // 动态属性注入 CSS
        sparkle.style.setProperty('--duration', `${duration}s`);
        sparkle.style.setProperty('--float-duration', `${floatDuration}s`);
        sparkle.style.setProperty('--rotate-duration', `${rotateDuration}s`);
        sparkle.style.setProperty('--max-opacity', maxOpacity);
        sparkle.style.setProperty('--move-x', `${moveX}px`);
        sparkle.style.setProperty('--move-y', `${moveY}px`);
        sparkle.style.setProperty('--rotation-end', rotationEnd);
        sparkle.style.animationDelay = `${delay}s, ${delay}s, ${delay}s`;
        
        // 增强霓虹发光效果
        const glowSize = size / 2;
        sparkle.style.filter = `blur(0.5px) drop-shadow(0 0 ${glowSize}px ${color})`;

        container.appendChild(sparkle);
      }

      for (let i = 0; i < count; i++) {
        createSparkle();
      }
    </script>
  </body>
</html>
